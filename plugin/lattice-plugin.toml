schema = 1
id = "io.github.knightnemo.lattice-remote"
name = "Lattice-web-ui"
version = "0.9.7"
api = 1
license = "MIT"
description = "Open the Lattice running on your Linux host in the browser, and pair your other devices with it."
repository = "https://github.com/lattice-writer/lattice-web-ui"
runtime = "node"
main = "main.mjs"

[[commands]]
id = "configure"
title = "Set workspace address…"
description = "Save the HTTPS address of a Lattice-web-ui workspace."
input = { kind = "text", placeholder = "https://your-machine.example.ts.net:8443" }

[[commands]]
id = "open"
title = "Open remote workspace"
description = "Open your configured remote workspace in the browser."

[[commands]]
id = "devices"
title = "Phone and app"
description = "Open the workspace on a phone, install it as an app, and pair or revoke devices."
